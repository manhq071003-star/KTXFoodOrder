<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bếp KTX Express Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background:#f0f2f5;">
<header class="navbar" style="background:#1e293b; color:#fff;">
    <div class="logo" style="color:#fff;"><i class="fa-solid fa-kitchen-set"></i> Bếp KTX Express Admin</div>
    <a href="index.html" style="color:#fff; text-decoration:none;"><i class="fa-solid fa-house"></i> Xem Trang Sinh Viên</a>
</header>

<div style="padding: 30px; max-width: 1200px; margin: 0 auto;">
    <div style="display:flex; gap:20px; margin-bottom: 20px;">
        <div style="flex:1; background:#fff; padding:20px; border-radius:10px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.05);">
            <p style="color:#666; font-size:14px;">Tổng Doanh Thu Phục Vụ</p>
            <h2 id="total-revenue" style="color:#ff5722; font-size:28px; margin-top:5px;">0 VNĐ</h2>
        </div>
        <div style="flex:1; background:#fff; padding:20px; border-radius:10px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.05);">
            <p style="color:#666; font-size:14px;">Tổng Số Đơn Hàng</p>
            <h2 id="total-orders" style="color:#ff5722; font-size:28px; margin-top:5px;">0 Đơn</h2>
        </div>
        <div style="flex:1; background:#fff; padding:20px; border-radius:10px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.05);">
            <p style="color:#666; font-size:14px;">Món Ăn Đang Bán</p>
            <h2 id="active-foods" style="color:#ff5722; font-size:28px; margin-top:5px;">13 / 13 Món</h2>
        </div>
    </div>

    <div style="background:#fff; padding:20px; border-radius:10px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,0.05);">
        <h3 style="margin-bottom:15px; color:#333;">➕ Thêm Món Ăn Mới Vào Thực Đơn</h3>
        <div style="display:flex; gap:10px;">
            <input type="text" id="new-food-id" placeholder="Mã món (VD: F14)" style="padding:10px; flex:1; border:1px solid #ccc; border-radius:6px;">
            <input type="text" id="new-food-name" placeholder="Tên món ăn" style="padding:10px; flex:2; border:1px solid #ccc; border-radius:6px;">
            <input type="number" id="new-food-price" placeholder="Đơn giá (VNĐ)" style="padding:10px; flex:1; border:1px solid #ccc; border-radius:6px;">
            <input type="text" id="new-food-img" placeholder="Link hình ảnh (URL Unsplash)" style="padding:10px; flex:2; border:1px solid #ccc; border-radius:6px;">
            <button onclick="addNewFood()" style="padding:10px 20px; background:#00b894; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Thêm Món Ngay</button>
        </div>
    </div>

    <div style="background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.05);">
        <h3 style="color:#333;">🍴 Danh Sách Thực Đơn Món Ăn</h3>
        <table style="width:100%; border-collapse:collapse; margin-top:15px;" id="admin-food-table"></table>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
